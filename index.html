<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C1 Production Monitor</title>
    <!-- Bootstrap 5 CSS (Темна тема включена через data-bs-theme) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-bs-theme="dark" class="bg-dark text-light">

    <!-- Навігаційна панель з перемикачем мов -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary border-bottom border-secondary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-info" href="#">
                <i class="bi bi-cpu-fill me-2"></i>C1 Monitor
            </a>
            <div class="d-flex">
                <select id="langSelector" class="form-select form-select-sm bg-secondary text-white border-none" onchange="changeLanguage()">
                    <option value="uk" selected>🇺🇦 Українська</option>
                    <option value="cs">🇨🇿 Čeština</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-3 px-md-5">
        <div class="row g-4">
            <!-- Ліва колонка: Форма та статистика -->
            <div class="col-12 col-lg-4">
                <div class="card card-custom p-4 mb-4 shadow">
                    <h4 class="card-title mb-3 text-info d-flex align-items-center">
                        <i class="bi bi-plus-circle-fill me-2"></i><span data-i18n="addEntry">Внесення даних</span>
                    </h4>
                    <div class="mb-3">
                        <label for="dateInput" class="form-label" data-i18n="selectDate">Виберіть дату:</label>
                        <input type="date" id="dateInput" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="percentageInput" class="form-label" data-i18n="enterPercentage">Відсоток виробітку (%):</label>
                        <div class="input-group">
                            <input type="number" id="percentageInput" class="form-control" min="50" max="200" placeholder="112">
                            <span class="input-group-text bg-secondary text-white">%</span>
                        </div>
                    </div>
                    <button class="btn btn-info w-100 fw-bold" onclick="saveData()" data-i18n="saveBtn">Зберегти дані</button>
                </div>

                <!-- Блок статистики -->
                <div class="card card-custom p-4 shadow">
                    <h4 class="card-title mb-3 text-warning d-flex align-items-center">
                        <i class="bi bi-graph-up-arrow me-2"></i><span data-i18n="stats">Статистика за місяць</span>
                    </h4>
                    <div class="mb-3">
                        <label for="monthFilter" class="form-label" data-i18n="selectMonth">Обрати місяць:</label>
                        <input type="month" id="monthFilter" class="form-control" onchange="renderAll()">
                    </div>
                    <div class="p-3 bg-secondary bg-opacity-25 rounded border border-secondary text-center">
                        <div class="small text-muted" data-i18n="monthlyAverage">Середній показник за місяць</div>
                        <div class="display-5 fw-bold text-success" id="averageDisplay">0.00%</div>
                    </div>
                </div>
            </div>

            <!-- Права колонка: Візуальний КАЛЕНДАР та таблиця -->
            <div class="col-12 col-lg-8">
                <!-- Календарна сітка -->
                <div class="card card-custom p-4 mb-4 shadow">
                    <h4 class="card-title mb-3 text-success d-flex align-items-center">
                        <i class="bi bi-calendar3 me-2"></i><span data-i18n="calendarView">Візуальний календар змін</span>
                    </h4>
                    
                    <!-- Дні тижня -->
                    <div class="calendar-grid-header text-muted fw-bold mb-2">
                        <div data-i18n="mon">Пн</div><div data-i18n="tue">Вт</div><div data-i18n="wed">Ср</div>
                        <div data-i18n="thu">Чт</div><div data-i18n="fri">Пт</div><div data-i18n="sat" class="text-danger">Сб</div>
                        <div data-i18n="sun" class="text-danger">Нд</div>
                    </div>
                    
                    <!-- Тіло календаря (генерується через JS) -->
                    <div id="calendarGrid" class="calendar-grid"></div>
                </div>

                <!-- Таблиця швидкого перегляду / видалення -->
                <div class="card card-custom p-4 shadow">
                    <h4 class="card-title mb-3 text-secondary d-flex align-items-center">
                        <i class="bi bi-list-task me-2"></i><span data-i18n="historyTable">Список змін за місяць</span>
                    </h4>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle text-center">
                            <thead>
                                <tr>
                                    <td class="fw-bold" data-i18n="tableDate">Дата</td>
                                    <td class="fw-bold" data-i18n="tableValue">Виробіток</td>
                                    <td class="fw-bold" data-i18n="tableAction">Дія</td>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS та кастомний скрипт -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
